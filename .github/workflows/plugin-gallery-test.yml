name: Test plugin gallery with Qt 6
on:
  push:
    paths:
      - 'plugin/**'
      - 'tests/test_gallery_qt.py'
      - '.github/workflows/plugin-gallery-test.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'tests/test_gallery_qt.py'
      - '.github/workflows/plugin-gallery-test.yml'
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare isolated Qt test runtime
        run: |
          python3 -m venv /tmp/gallery-test-runtime
          /tmp/gallery-test-runtime/bin/python -m pip install PySide6-Essentials==6.8.3
      - name: Load gallery and select a video offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: /tmp/gallery-test-runtime/bin/python -m unittest discover -s tests -p test_gallery_qt.py -v
