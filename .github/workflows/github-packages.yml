name: Publish GitHub Packages
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        default: v0.1.0-alpha.3
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [plasma-video-wallpaper, wallpaper-engine-to-mp4]
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - name: Check out packaging instructions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Build release file package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          mkdir bundle
          if [[ "$COMPONENT" == plasma-video-wallpaper ]]; then
            git archive "refs/tags/${RELEASE_TAG}:plugin" | tar -x -C bundle
          else
            git archive "refs/tags/${RELEASE_TAG}" | tar -x -C bundle
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/${COMPONENT}:${RELEASE_TAG}"
          docker build -f packaging/oci.Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.description=Very early alpha file package; extract /package, not a runnable desktop container" \
            --tag "$image" bundle
          echo "PACKAGE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Verify packaged files
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker create "$PACKAGE_IMAGE" /unused)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir extracted
          docker cp "$container:/package/." extracted/
          test -f extracted/README.md
          test -f extracted/LICENSE
          if [[ "$COMPONENT" == plasma-video-wallpaper ]]; then
            test -f extracted/metadata.json
            test -f extracted/contents/ui/config.qml
          else
            test -f extracted/wallpaper_to_mp4.py
            test -f extracted/plugin/metadata.json
          fi
      - name: Publish package
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKAGE_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$PACKAGE_IMAGE"
