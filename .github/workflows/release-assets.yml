name: Package release downloads
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Build independent plugin and converter archives
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          mkdir dist
          git archive --format=zip --prefix=plasma-video-wallpaper/ -o "dist/plasma-video-wallpaper-${RELEASE_TAG}.zip" HEAD:plugin
          git archive --format=zip --prefix=wallpaper-engine-to-mp4/ -o "dist/wallpaper-engine-to-mp4-${RELEASE_TAG}.zip" HEAD
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Attach downloads to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # A tag push may start this job before the release page is created.
          for attempt in {1..12}; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS
